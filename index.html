<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./public/img/logo/logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./public/img/logo/logo.png">
    <link rel="apple-touch-icon" href="./public/img/logo/logo.png">
    <link rel="manifest" href="./public/manifest.json">
    <meta name="theme-color" content="#f7f3ee">
    <title>Receitas da Casa</title>
    <link rel="stylesheet" href="./src/css/output.css" />

<body class="bg-[#f7f3ee]">
    <section class="w-full p-5">
        <div class="max-w-lg ">
            <div class="flex flex-col gap-5 ">
                <div class="flex items-center">
                    <img src="./public/img/icons/lamen.png" class="w=2- h-20 " />
                    <h1 class="text-2xl text-[#b15d3b] font-bold">Receitas de Casa</h1>
                </div>
                <input type="text" placeholder="Busque a Receita"
                    class="rounded-xl p-2 border border-[#b15d3b] w-full shadow-md/20 text-[#b15d3b] outline-0">
            </div>
        </div>
    </section>
    <section class="w-full p-5">
        <div class="max-w-lg ">
            <div class="flex flex-col gap-5 bg-[#b15d3b] p-5 rounded-xl">
                <h1 class="text-white font-bold text-xl">Feito com muito amor e carinho para a melhor Esposa que já
                    existiu na
                    face da Terra ❤️</h1>
                <div
                    class="p-2 bg-cyan-600 shadow-md/20 rounded-xl flex items-center justify-center cursor-pointer hover:bg-cyan-500">
                    <h1 class="text-white font-medium">Ver Receitas</h1>
                </div>
            </div>
        </div>
    </section>
    <section class="w-full p-5">
        <div class="max-w-lg">
            <div class="flex flex-col gap-5">
                <h1 class="font-bold text-xl">Categorias</h1>
                <div class="max-w-75 flex gap-3 pb-2  overflow-x-scroll">
                    <div
                        class="flex  items-center gap-1 px-5 py-2 bg-white rounded-xl cursor-pointer hover:bg-[#b15d3b] hover:text-white transition-all ease-linear duration-150">
                        <img src="./public/img/icons/macarrao.png" class="max-w-5" />
                        <h1>Massas</h1>
                    </div>
                    <div
                        class="flex  items-center gap-1 px-5 py-2 bg-white rounded-xl cursor-pointer hover:bg-[#b15d3b] hover:text-white transition-all ease-linear duration-150">
                        <img src="./public/img/icons/sobremessa.png" class="max-w-5" />
                        <h1>Sobremesas</h1>
                    </div>
                    <div
                        class="flex  items-center gap-1 px-5 py-2 bg-white rounded-xl cursor-pointer hover:bg-[#b15d3b] hover:text-white transition-all ease-linear duration-150">
                        <img src="./public/img/icons/cafe.png" class="max-w-5" />
                        <h1>Café</h1>
                    </div>
                    <div
                        class="flex  items-center gap-1 px-5 py-2 bg-white rounded-xl cursor-pointer hover:bg-[#b15d3b] hover:text-white transition-all ease-linear duration-150">
                        <img src="./public/img/icons/lanche.png" class="max-w-5" />
                        <h1>Lanches</h1>
                    </div>
                    <div
                        class="flex  items-center gap-1 px-5 py-2 bg-white rounded-xl cursor-pointer hover:bg-[#b15d3b] hover:text-white transition-all ease-linear duration-150">
                        <img src="./public/img/icons/favorito.png" class="max-w-5" />
                        <h1>Favoritas</h1>
                    </div>
                </div>
                <div id="show" class="bg-white rounded-2xl p-2">
                    <h1>ola</h1>
                </div>
            </div>
        </div>
    </section>
    <script type="module" src="./src/js/script.js"></script>
</body>

</html>
